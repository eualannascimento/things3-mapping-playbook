[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "things3-mapping-playbook"
version = "0.2.0"
description = "A verified map of what Things 3 automation can and cannot do, plus the code to do it safely"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
things3 = "things3.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live suite talks to a real Things install and is opt-in: `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: talks to a real Things 3 install (opt-in, macOS only)"]

[tool.setuptools]
packages = ["things3"]
